name: Download The Hitch-Hiker (1953) and publish ZIP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/download-hitch-hiker-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hitch-hiker-zip
  cancel-in-progress: false

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download movie from Internet Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 3600 \
            --user-agent "Mozilla/5.0 (compatible; personal archive packaging)" \
            'https://archive.org/download/Hitch_Hiker/Hitch-Hiker.mp4' \
            --output 'package/Hitch-Hiker.mp4'
          test -s 'package/Hitch-Hiker.mp4'
          size="$(stat -c%s 'package/Hitch-Hiker.mp4')"
          echo "Downloaded bytes: $size"
          test "$size" -lt 2000000000
          python3 - <<'PY'
          from pathlib import Path
          p = Path("package/Hitch-Hiker.mp4")
          with p.open("rb") as f:
              header = f.read(32)
          assert len(header) == 32 and header[4:8] == b"ftyp", (
              f"Downloaded source does not look like MP4: {header!r}"
          )
          print(f"MP4 header verified: {p.stat().st_size} bytes")
          PY

      - name: Verify movie has audio, video and expected duration
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 - <<'PY'
          import json, subprocess
          movie = "package/Hitch-Hiker.mp4"
          result = subprocess.run(
              ["ffprobe", "-v", "error", "-show_streams", "-show_format",
               "-of", "json", movie],
              check=True, capture_output=True, text=True
          )
          data = json.loads(result.stdout)
          streams = data.get("streams", [])
          assert any(s.get("codec_type") == "video" for s in streams), "Missing video"
          assert any(s.get("codec_type") == "audio" for s in streams), "Missing audio"
          duration = float(data["format"]["duration"])
          assert 3600 <= duration <= 4500, f"Unexpected duration: {duration:.1f}s"
          print(f"Duration verified: {duration:.1f}s")
          PY

      - name: Create and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd package
          zip -0 -j 'The-Hitch-Hiker-1953.zip' 'Hitch-Hiker.mp4'
          unzip -tq 'The-Hitch-Hiker-1953.zip'
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path("The-Hitch-Hiker-1953.zip")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, "ZIP CRC check failed"
              assert z.namelist() == ["Hitch-Hiker.mp4"], z.namelist()
          print(f"ZIP verified: {p.stat().st_size} bytes")
          PY

      - name: Publish ZIP as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="the-hitch-hiker-1953-zip"
          asset="package/The-Hitch-Hiker-1953.zip"
          notes=$(cat <<'NOTES'
          The Hitch-Hiker (1953), packaged as one ZIP containing Hitch-Hiker.mp4.

          Source: https://archive.org/download/Hitch_Hiker/Hitch-Hiker.mp4
          Internet Archive item: https://archive.org/details/Hitch_Hiker

          The Archive item labels the film Public Domain. This is source metadata,
          not an independent legal opinion for every country or every transfer.
          NOTES
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" \
              --title "The Hitch-Hiker (1953) - ZIP" \
              --notes "$notes"
          fi
