name: Download Carnival of Souls (1962) 1080p and publish ZIP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/download-carnival-of-souls-1962-1080p-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carnival-of-souls-1962-1080p-zip
  cancel-in-progress: false

jobs:
  download-verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download 1080p WebM from Wikimedia Commons
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work package
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 5400 \
            --user-agent "Mozilla/5.0 (compatible; personal archive packaging)" \
            'https://upload.wikimedia.org/wikipedia/commons/6/69/Carnival_of_Souls_%281962%29_by_Herk_Harvey.webm' \
            --output 'work/Carnival-of-Souls-1962-1080p.webm'
          test -s 'work/Carnival-of-Souls-1962-1080p.webm'
          size="$(stat -c%s 'work/Carnival-of-Souls-1962-1080p.webm')"
          echo "Downloaded WebM bytes: $size"
          # Keep a safety margin below GitHub Release's 2 GB per-asset limit.
          test "$size" -lt 1900000000
          file 'work/Carnival-of-Souls-1962-1080p.webm'

      - name: Verify true 1080p video, audio and runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path

          movie = "work/Carnival-of-Souls-1962-1080p.webm"
          result = subprocess.run(
              ["ffprobe", "-v", "error", "-show_streams", "-show_format",
               "-of", "json", movie],
              check=True, capture_output=True, text=True
          )
          data = json.loads(result.stdout)
          streams = data.get("streams", [])
          video = [s for s in streams if s.get("codec_type") == "video"]
          audio = [s for s in streams if s.get("codec_type") == "audio"]
          assert video, "No video stream found"
          assert audio, "No audio stream found"
          v, a = video[0], audio[0]
          width, height = int(v.get("width", 0)), int(v.get("height", 0))
          duration = float(data["format"]["duration"])
          assert width >= 1920 and height >= 1080, (
              f"Actual resolution is below 1920x1080: {width}x{height}"
          )
          assert 4_300 <= duration <= 5_000, (
              f"Unexpected Carnival of Souls duration: {duration:.1f}s"
          )
          report = (
              "Carnival of Souls (1962) — Wikimedia Commons source\n"
              f"Verified resolution: {width}x{height}\n"
              f"Video codec: {v.get('codec_name')}\n"
              f"Video bitrate: {v.get('bit_rate')} bit/s\n"
              f"Frame rate: {v.get('avg_frame_rate')}\n"
              f"Audio codec: {a.get('codec_name')}\n"
              f"Audio sample rate: {a.get('sample_rate')} Hz\n"
              f"Audio bitrate: {a.get('bit_rate')} bit/s\n"
              f"Duration: {duration:.1f}s\n"
              f"WebM size: {Path(movie).stat().st_size} bytes\n"
          )
          Path("work/quality-report.txt").write_text(report, encoding="utf-8")
          print(report)
          PY
          sha256sum 'work/Carnival-of-Souls-1962-1080p.webm'

      - name: Create and verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          cp work/Carnival-of-Souls-1962-1080p.webm package/
          cp work/quality-report.txt package/
          cd package
          zip -0 -j 'Carnival-of-Souls-1962-1080p.zip' \
            'Carnival-of-Souls-1962-1080p.webm' 'quality-report.txt'
          unzip -tq 'Carnival-of-Souls-1962-1080p.zip'
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path("Carnival-of-Souls-1962-1080p.zip")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, "ZIP CRC verification failed"
              assert set(z.namelist()) == {
                  "Carnival-of-Souls-1962-1080p.webm",
                  "quality-report.txt"
              }, z.namelist()
          print(f"ZIP verified: {p.stat().st_size} bytes")
          PY

      - name: Publish ZIP as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="carnival-of-souls-1962-1080p-zip"
          asset="package/Carnival-of-Souls-1962-1080p.zip"
          notes=$(cat <<'NOTES'
          Carnival of Souls (1962), 1080p WebM source packaged as one ZIP.
          The ZIP includes a technical quality report generated by ffprobe.
          Video/audio properties and true 1920x1080 dimensions are checked
          before publishing. The video is stored without re-encoding.

          Source:
          https://commons.wikimedia.org/wiki/File:Carnival_of_Souls_(1962)_by_Herk_Harvey.webm

          Wikimedia Commons page lists the media as freely licensed/public domain.
          Verify applicable jurisdiction and file-specific licensing independently.
          NOTES
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" \
              --title "Carnival of Souls (1962) - 1080p ZIP" \
              --notes "$notes"
          fi
