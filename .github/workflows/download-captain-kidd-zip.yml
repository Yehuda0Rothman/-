name: Download Captain Kidd (1945) and publish ZIP

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/download-captain-kidd-zip.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: captain-kidd-1945-zip
  cancel-in-progress: false

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download the 512 kbps MP4 from Internet Archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 30 --max-time 3600 \
            --user-agent "Mozilla/5.0 (compatible; personal archive packaging)" \
            'https://archive.org/download/CaptainKidd_/CaptainKidd_512kb.mp4' \
            --output 'package/Captain-Kidd-1945.mp4'
          test -s 'package/Captain-Kidd-1945.mp4'
          size="$(stat -c%s 'package/Captain-Kidd-1945.mp4')"
          echo "Downloaded MP4 bytes: $size"
          # GitHub Release assets must stay below 2 GB; keep a margin.
          test "$size" -lt 1900000000
          python3 - <<'PY'
          from pathlib import Path
          p = Path("package/Captain-Kidd-1945.mp4")
          with p.open("rb") as f:
              header = f.read(32)
          assert len(header) == 32 and header[4:8] == b"ftyp", (
              f"Downloaded source does not look like MP4: {header!r}"
          )
          print(f"MP4 header verified; {p.stat().st_size} bytes")
          PY

      - name: Verify video, audio and feature-film duration
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 - <<'PY'
          import json, subprocess
          movie = "package/Captain-Kidd-1945.mp4"
          result = subprocess.run(
              ["ffprobe", "-v", "error", "-show_streams", "-show_format",
               "-of", "json", movie],
              check=True, capture_output=True, text=True
          )
          data = json.loads(result.stdout)
          streams = data.get("streams", [])
          video = [s for s in streams if s.get("codec_type") == "video"]
          audio = [s for s in streams if s.get("codec_type") == "audio"]
          assert video, "No video stream found"
          assert audio, "No audio stream found"
          duration = float(data["format"]["duration"])
          assert 4_800 <= duration <= 5_700, (
              f"Unexpected duration for Captain Kidd: {duration:.1f}s"
          )
          print(f"Video: {video[0].get('width')}x{video[0].get('height')} "
                f"{video[0].get('codec_name')}")
          print(f"Audio: {audio[0].get('codec_name')}")
          print(f"Duration verified: {duration:.1f}s")
          PY

      - name: Create and verify one ZIP file
        shell: bash
        run: |
          set -euo pipefail
          cd package
          zip -0 -j 'Captain-Kidd-1945.zip' 'Captain-Kidd-1945.mp4'
          unzip -tq 'Captain-Kidd-1945.zip'
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path("Captain-Kidd-1945.zip")
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, "ZIP CRC verification failed"
              assert z.namelist() == ["Captain-Kidd-1945.mp4"], z.namelist()
          print(f"ZIP verified: {p.stat().st_size} bytes")
          PY

      - name: Publish ZIP as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="captain-kidd-1945-zip"
          asset="package/Captain-Kidd-1945.zip"
          notes=$(cat <<'NOTES'
          Captain Kidd (1945), packaged as one ZIP containing Captain-Kidd-1945.mp4.

          Source file: https://archive.org/download/CaptainKidd_/CaptainKidd_512kb.mp4
          Internet Archive item: https://archive.org/details/CaptainKidd_

          The Internet Archive item labels this film Public Domain. This is source
          metadata, not an independent legal opinion for every country or transfer.
          NOTES
          )
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$asset" --repo "$GITHUB_REPOSITORY" \
              --title "Captain Kidd (1945) - ZIP" \
              --notes "$notes"
          fi
